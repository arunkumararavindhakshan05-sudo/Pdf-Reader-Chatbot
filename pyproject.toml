[project]
name = "pdf-reader-chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "groq>=0.37.1",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pypdf>=6.16.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
